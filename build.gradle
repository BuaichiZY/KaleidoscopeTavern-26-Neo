plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "kaleidoscopetavern-${minecraft_version}"
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "v${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/client')
        }
        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments = [
                    "--username", "tartaric_acid"
            ]
            gameDirectory = project.file('run/client2')
        }
        server {
            server()
            //programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/server')
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    // Validate current data generators in an isolated build directory.
                    // The complete 1.2 resource set is intentionally kept checked in
                    // under src/generated/resources and must not be pruned by runData.
                    '--output', file('build/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            jvmArguments = [
                    "-XX:+IgnoreUnrecognizedVMOptions",
                    "-XX:+AllowEnhancedClassRedefinition"
            ]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

repositories {
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.5.0.26"
    // Install the full JEI mod in run/client only when testing that optional integration.

    // EMI
    compileOnly "maven.modrinth:emi:1.1.22+1.21.1+neoforge"

    // REI
    compileOnly "maven.modrinth:cloth-config:15.0.140+neoforge"
    compileOnly "maven.modrinth:architectury-api:13.0.8+neoforge"
    compileOnly "maven.modrinth:rei:16.0.788+neoforge"

    // Jade
    implementation "maven.modrinth:jade:26.1.1+neoforge"

    // KubeJS
    // compileOnly "dev.latvian.mods:rhino:2101.2.7-build.72"
    // compileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.336"
    // runtimeOnly "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-1.7"
    // runtimeOnly "curse.maven:probejs-585406:5820894"

    // runtimeOnly "maven.modrinth:nbtedit-reborn:5.2.11+mc1.21.1-neoforge"
    // runtimeOnly "maven.modrinth:kiwi:15.6.1+neoforge"

    // Ponder
    compileOnly "net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.56"
    // runtimeOnly "maven.modrinth:create:1.21.1-6.0.6"

    // runtimeOnly "maven.modrinth:carry-on:2.2.4-neoforge,1.21.1"

    // 节气
    // runtimeOnly "curse.maven:ecliptic-seasons-1118306:7041469"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${version}"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

// These optional recipe-viewer adapters still target their 1.21-era plugin APIs.
// Keep the sources as porting references without shipping incompatible classes.
sourceSets.main.java {
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/compat/emi/category/EmiShakerRecipe.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/compat/rei/category/ReiShakerRecipeCategory.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/datagen/tag/TagEntityType.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/network/message/DrinkEffectSyncS2CMessage.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/BarCabinetBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/BarStoolBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/BarrelBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/ChalkboardBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/PressingTubBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/SandwichBoardBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/TextBlockEntityRenderState.java'
    exclude 'com/github/ysbbbbbb/kaleidoscopetavern/client/render/renderstate/ThrownMolotovEntityRenderState.java'
}

// ModDev defaults its asset helper to Java 21. Java 25 can run that helper and
// keeps the complete local development workflow on the requested toolchain.
tasks.named('downloadAssets').configure {
    def java25Launcher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    javaExecutable.set(java25Launcher.map { it.executablePath.asFile.absolutePath })
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

tasks.named('sourcesJar', Jar).configure {
    archiveClassifier = 'source'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
